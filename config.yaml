# ============================================================================
#  Evaluation harness configuration
#  Single source of truth: brands, aliases, trade dress signals, judge model.
#  NO paths/constants hardcoded in code — everything lives here.
# ============================================================================

# LLM-as-a-judge model used by run_eval.py --judge llm
judge:
  model_path: "Qwen/Qwen2.5-32B-Instruct"   # local path or HF id
  max_new_tokens: 128
  temperature: 0.0
  max_input_tokens: 4096

# Canonical categories + normalization of inconsistent names in source data.
# metrics.py maps a record's raw brand_category to its canonical form.
categories: [auto, beverages, food, sport, tech]
category_aliases:
  automotive: auto
  bev: beverages

# ----------------------------------------------------------------------------
#  Brand knowledge base (global ground truth).
#  - key            = canonical brand name (MUST equal values in expected_brands)
#  - aliases        = other names for the same brand (leakage detection in text);
#                     the canonical name is matched automatically, no need to repeat it
#  - trade_dress    = distinctive brand signals WITHOUT the name (logo, slogans, models...)
#
#  NOTE: trade_dress is filled only for the automotive category (from brands.json).
#  The other 16 brands have [] — TO BE FILLED (this is evaluation ground truth, not guessed).
# ----------------------------------------------------------------------------
brands:
  # --- automotive -----------------------------------------------------------
  Audi:
    category: auto
    aliases: []
    trade_dress: ["four rings", "four-ring logo", "quattro", "single-frame grille", "RS line", "e-tron", "Vorsprung durch Technik"]
  BMW:
    category: auto
    aliases: ["Bayerische Motoren Werke"]
    trade_dress: ["kidney grille", "M division", "M Sport", "roundel", "Hofmeister kink", "iDrive"]
  Porsche:
    category: auto
    aliases: []
    trade_dress: ["911", "rear-engine sports car", "Crest logo", "Turbo", "RS", "Stuttgart"]
  Tesla:
    category: auto
    aliases: ["Tesla Motors"]
    trade_dress: ["T logo", "Autopilot", "Full Self Driving", "FSD", "Supercharger", "Cybertruck", "Model S", "Model 3", "Model X", "Model Y"]

  # --- beverages ------------------------------------------------------------
  Coca-Cola:
    category: beverages
    aliases: ["Coca Cola", "Coke"]
    trade_dress: ["contour bottle", "Spencerian script logo", "dynamic ribbon", "Taste the Feeling", "Open Happiness", "It's the Real Thing", "polar bear mascots"]
  Pepsi:
