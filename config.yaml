runtime:
  dtype: bfloat16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_model_len: 4096
  max_num_seqs: 256
  enforce_eager: false
  max_tokens: 256
  temperature: 0.0
  seed: 42

models:
  qwen3-8b-base:
    path: Qwen/Qwen3-8B
    chat_template:
      enable_thinking: false

judge:
  model: qwen3-8b-base
  runtime:
    dtype: bfloat16
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_model_len: 2048
    max_num_seqs: 64
    enforce_eager: false
    max_tokens: 128
    temperature: 0.0
    seed: 42
  evaluation:
    evaluators:
      target_brand_present:
        system_prompt: eval/prompts/system/target_brand.txt
        user_prompt: eval/prompts/user/target_brand_present.txt
        output: {field: mentioned, type: boolean}
      target_trade_dress_present:
        system_prompt: eval/prompts/system/target_brand.txt
        user_prompt: eval/prompts/user/target_trade_dress_present.txt
        output: {field: trade_dress_present, type: boolean}
      brands_mentioned:
        system_prompt: eval/prompts/system/brand_extraction.txt
        user_prompt: eval/prompts/user/brands_mentioned.txt
        output: {field: brands, type: string_list}
      trade_dress_brands:
        system_prompt: eval/prompts/system/brand_extraction.txt
        user_prompt: eval/prompts/user/trade_dress_brands.txt
        output: {field: brands, type: string_list}
      stance:
        system_prompt: eval/prompts/system/stance.txt
        user_prompt: eval/prompts/user/stance.txt
        output: {field: stance, type: string}
      qa_correct:
        system_prompt: eval/prompts/system/qa.txt
        user_prompt: eval/prompts/user/qa_correct.txt
        output: {field: correct, type: boolean}
      quality_1_5:
        system_prompt: eval/prompts/system/quality.txt
        user_prompt: eval/prompts/user/quality_1_5.txt
        output: {field: score, type: integer}
    tasks:
      benchmark: [target_brand_present, target_trade_dress_present, brands_mentioned, trade_dress_brands]
      forget: [target_brand_present, target_trade_dress_present, brands_mentioned, trade_dress_brands]
      scenario: [brands_mentioned, trade_dress_brands]
      choices: [target_brand_present, target_trade_dress_present, brands_mentioned, trade_dress_brands]
      thesis: [stance, target_brand_present, target_trade_dress_present, brands_mentioned, trade_dress_brands]
      retain: [qa_correct]
      world_facts: [qa_correct]

